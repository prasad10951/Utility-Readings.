async function PSAVE(name,data){const u=URL.createObjectURL(new Blob([data]));const l=document.createElement("a");l.href=u;l.download=name;document.body.appendChild(l);l.click();l.remove();setTimeout(()=>URL.revokeObjectURL(u),4000)}
async function DELIVER(buf,name){const f=new File([buf],name,{type:"application/pdf"});

function nextState(){const c=calc(),pe={...S.pe};[...WM,...EL].forEach(([id])=>{if(c[id].F!==null)pe[id]=c[id].F});if(c.F7!==null)pe.e7=Math.round(c.F7*10)/10;if(c.F8!==null)pe.e8=c.F8;if(c.F9!==null)pe.e9=c.F9;if(c.F10!==null)pe.e10=Math.round(c.F10*10)/10;
const pt={...S.pt,...Object.fromEntries(Object.entries(S.tl).filter(e=>e[1]!==""))},dby={d:c.t.d.yc??S.dby.d,i:c.t.i.yc??S.dby.i,f:c.t.f.yc??S.dby.f};return {pv:{...S.pv,...S.v},pe,m0:S.m0,pt,dby}}

const elec=[["Sl","Electrical Meter","Yesterday readings (KWH)","Today Readings (KWH)","Yesterday consumption","Today consumption","Total consumption","Difference","Month start readings"],...EL.map(([id,n],i)=>{const o=c[id];return [9+i,n,N(o.C),N(o.D),N(o.E),N(o.F),N(o.G),N(o.H),N(o.I)]}),["","Total From MDB","","",N(c.mdbE),N(c.mdb),N(c.mdbG),"",""],["","Total From PPP","","",N(c.pppE),N(c.ppp),N(c.pppG),"",""]];
const tank=[["Sl","Water Tank","Yesterday MTR","Yesterday CBM","Today MTR","Today CBM","Capacity","Difference","DBY CBM"],...TN.map(([k,n,f,cap],i)=>{const t=c.t[k];return [18+i,n,N(t.ym),N(t.yc),N(t.tm),N(t.tc),cap,N(t.tc===null||t.yc===null?null:t.tc-t.yc),N(S.dby[k])]})];
const box=[["REPORT",""],["Domestic water Received",N(c.dom.F)],["Irrigation water TSE Received",N(c.tse.F)],["Irrigation water consumption",N(c.t12_0.F)],["Domestic water consumption",N(c.F7)],["Fire water consumption",N(c.F8)],["Total consumption from MDB",N(c.mdb)],["Total consumption from PPP",N(c.ppp)]];
const W=S.wa,wa=[["Water Analysis","PH","Chlorine"],["Domestic Water (MEP)",(W.dom||{}).ph||"",(W.dom||{}).cl||""],["V-101",(W.v101||{}).ph||"",(W.v101||{}).cl||""],[(W.loc||{}).n||"",(W.loc||{}).ph||"",(W.loc||{}).cl||""]];
const pn={};ALL.forEach(m=>{pn[m[0]]=m[1]+" ("+m[2]+")"});return {title:"Date: "+S.date+"   Shebara Resort (HLP Reading)",water,elec,tank,box,wa,photoNames:pn}}
async function cloudSave(){if(busy||!PIN)return;busy=true;cs("Saving...");try{const photos={};Object.keys(S.up||{}).forEach(k=>{if(S.p[k])photos[k]={b64:S.p[k].d.split(",")[1],t:S.p[k].t,w:S.p[k].w,h:S.p[k].h}});
const r=await api("save",{date:S.date,by:S.by,day:{v:S.v,tl:S.tl,wa:S.wa,note:S.note,pv:S.pv,pe:S.pe,m0:S.m0,pt:S.pt,dby:S.dby,by:S.by},next:nextState(),cons:cons(),rep:repData(),photos,removed:S.rm||[]});
if(!r.ok)throw new Error(r.err);S.up={};S.rm=[];S.dirty=0;cs("Saved to shared sheet ✓ "+hhmm())}catch(e){const m=String(e.message||e);cs("Not saved: "+m);if(/PIN/.test(m)){PIN="";try{localStorage.removeItem("hlp_pin")}catch(_){}}}busy=false;persist()}
async function cloudLoad(){if(!PIN){PIN=prompt("Enter team PIN")||"";if(PIN)try{localStorage.setItem("hlp_pin",PIN)}catch(e){}}if(!PIN){cs("No PIN - this phone only");return}cs("Loading shared data...");
try{const r=await api("load",{date:S.date});if(!r.ok)throw new Error(r.err);S.hist=r.hist||S.hist;
if(!S.dirty){if(r.today){const t=r.today;["v","tl","wa","pv","pe","m0","pt","dby"].forEach(k=>{if(t[k])S[k]=t[k]});S.note=t.note||"";if(t.by)S.by=t.by;S.p=t.photos||{};S.up={};S.rm=[];S.auto={}}
else if(r.next){const n=r.next;["pv","pe","pt","dby"].forEach(k=>{if(n[k])S[k]=n[k]});S.m0=n.m0||S.m0;if(r.latestDate&&S.date.slice(0,7)!==r.latestDate.slice(0,7))S.m0={...n.pv};S.v={};S.tl={};S.wa={};S.p={};S.note="";S.up={};S.rm=[];S.auto={}}}
$("by").value=S.by;persist();render();cs("Shared data loaded ✓ "+hhmm())}catch(e){const m=String(e.message||e);cs("Could not load: "+m);if(/PIN/.test(m)){PIN="";try{localStorage.removeItem("hlp_pin")}catch(_){}}}}
/*END*/
function openDB(){return new Promise(res=>{try{const q=indexedDB.open("util",1);q.onupgradeneeded=()=>q.result.createObjectStore("s");q.onsuccess=()=>{db=q.result;res()};q.onerror=()=>res()}catch(e){res()}})}

function save(){if(typeof PIN!=="undefined"&&PIN)dirty();clearTimeout(tmr);tmr=setTimeout(()=>{if(!db)return;try{db.transaction("s","readwrite").objectStore("s").put(S,"d")}catch(e){}},400)}
const fields=m=>m[3]?m[3].map((l,i)=>[m[0]+"_"+i,l]):[[m[0],""]];
function used(id){const a=parseFloat(S.v[id]),b=parseFloat(S.pv[id]);return isNaN(a)||isNaN(b)?"":"Used "+(Math.round((a-b)*100)/100)}
function num(id){const a=parseFloat(S.v[id]),b=parseFloat(S.pv[id]);return isNaN(a)||isNaN(b)?null:a-b}
function cons(){const o={},one=(k,id)=>{const x=num(id);if(x!==null)o[k]=x};one("dom","dom");one("tse","tse");one("g01","g01");one("g07","g07");let t=0,n=0;L.forEach(m=>{const x=num(m[0]);if(x!==null){t+=x;n++}});if(n)o.lpg=Math.round(t*100)/100;return o}
function card(m){const d=document.createElement("div");d.className="card";let h=`<b>${m[1]}</b> <small>${m[2]}</small>`;
fields(m).forEach(([id,l])=>{h+=`<div class="row"><label>${l}</label><input type="number" inputmode="decimal" placeholder="Yesterday" class="f" data-id="${id}" data-w="pv" value="${S.pv[id]??""}"><input type="number" inputmode="decimal" placeholder="Today" class="f" data-id="${id}" data-w="v" value="${S.v[id]??""}" style="${S.auto[id]?"border-color:#e8710a;border-width:2px":""}"><span class="used" id="u_${id}">${used(id)}</span></div>`});
h+=`<div class="row prow" style="flex-wrap:wrap"><button class="g" data-p="${m[0]}">📷 Live</button><label class="g lb2">📱 Phone<input type="file" accept="image/*" capture="environment" class="pin" data-k="${m[0]}"></label><label class="g lb2">🖼 Gallery<input type="file" accept="image/*" class="pin gal" data-k="${m[0]}"></label></div>${S.p[m[0]]?`<div class="row"><img class="th" data-del="${m[0]}" src="${S.p[m[0]].d}"><small>Double tap photo to delete<br>${S.p[m[0]].t}</small></div>`:""}`;d.innerHTML=h;return d}
function wc(){return (S.note.trim().match(/\S+/g)||[]).length}
function tankCard(){const d=document.createElement("div");d.className="card";let h="<b>Water tank levels</b> <small>in metres</small>";
[["d","Domestic Tank",204],["i","Irrigation Tank",204],["f","Fire tank",136]].forEach(([k,n,f])=>{h+=`<div class="row"><label style="flex:0 0 80px">${n}</label><input type="number" inputmode="decimal" step="0.1" placeholder="Yesterday m" class="tk" data-w="pt" data-k="${k}" value="${S.pt[k]??""}"><input type="number" inputmode="decimal" step="0.1" placeholder="Today m" class="tk" data-w="tl" data-k="${k}" value="${S.tl[k]??""}"><span class="used" id="tc_${k}">${S.tl[k]!==undefined&&S.tl[k]!==""?Math.round(S.tl[k]*f*10)/10+" CBM":""}</span></div>`});d.innerHTML=h;return d}
